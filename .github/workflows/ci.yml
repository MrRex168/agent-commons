name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_commons
          POSTGRES_PASSWORD: agent_commons
          POSTGRES_DB: agent_commons_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_commons -d agent_commons_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGENT_COMMONS_TEST_DATABASE_URL: postgresql+psycopg://agent_commons:agent_commons@localhost:5432/agent_commons_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Migrate
        env:
          AGENT_COMMONS_DATABASE_URL: ${{ env.AGENT_COMMONS_TEST_DATABASE_URL }}
        run: alembic upgrade head

      - name: Test
        run: pytest -q

      - name: Rehearse PostgreSQL backup and restore
        env:
          AGENT_COMMONS_PREVIEW_RESTORE: "1"
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          AGENT_COMMONS_DEMO_DATABASE_URL: postgresql://agent_commons:agent_commons@127.0.0.1:5432/postgres
        run: |
          PG_TOOLS="$RUNNER_TEMP/postgres-tools"
          mkdir "$PG_TOOLS"
          for tool in pg_dump pg_restore; do
            printf '#!/bin/bash\nexec docker exec -i -e PGHOST=127.0.0.1 -e PGUSER -e PGPASSWORD -e PGDATABASE %q %q "$@"\n' \
              "$POSTGRES_CONTAINER" "$tool" > "$PG_TOOLS/$tool"
            chmod 700 "$PG_TOOLS/$tool"
          done
          export PATH="$PG_TOOLS:$PATH"
          pg_dump --version
          pg_restore --version
          pytest -q tests/test_preview_restore.py

      - name: Run integration demos
        env:
          AGENT_COMMONS_DATABASE_URL: ${{ env.AGENT_COMMONS_TEST_DATABASE_URL }}
        run: |
          uvicorn agent_commons.main:app --host 127.0.0.1 --port 8000 > /tmp/agent-commons.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          python scripts/demo.py
          python scripts/multi_runtime_demo.py
          python scripts/multi_runtime_demo.py

      - name: Prove cross-instance sovereign migration
        run: python scripts/cross_instance_ci.py

      - name: Prove Agent Internet Live over A2A
        env:
          AGENT_COMMONS_DEMO_DATABASE_URL: postgresql://agent_commons:agent_commons@127.0.0.1:5432/postgres
          AGENT_COMMONS_DEMO_EVIDENCE_PATH: agent-internet-live-evidence.json
        run: pytest -q tests/test_agent_internet_live.py tests/test_outbound_a2a.py

      - name: Prove typed collaboration and migration
        env:
          AGENT_COMMONS_DEMO_DATABASE_URL: postgresql://agent_commons:agent_commons@127.0.0.1:5432/postgres
          AGENT_COMMONS_COLLABORATION_EVIDENCE_PATH: collaboration-live-evidence.json
        run: pytest -q tests/test_agent_collaboration_live.py

      - name: Upload sanitized typed collaboration evidence
        uses: actions/upload-artifact@v4
        with:
          name: collaboration-live-evidence
          path: collaboration-live-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Render the evidence dashboard
        env:
          AGENT_COMMONS_DASHBOARD_EVIDENCE_PATH: agent-internet-live-evidence.json
          AGENT_COMMONS_COLLABORATION_EVIDENCE_PATH: collaboration-live-evidence.json
        run: pytest -q tests/test_agent_internet_dashboard.py -k "real_milestone or real_collaboration"

      - name: Upload sanitized Agent Internet Live evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-internet-live-evidence
          path: agent-internet-live-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Test the upstream A2A SDK compatibility spike
        env:
          AGENT_COMMONS_A2A_SDK_SPIKE: "1"
          AGENT_COMMONS_DEMO_DATABASE_URL: postgresql://agent_commons:agent_commons@127.0.0.1:5432/postgres
        run: |
          pip install -r tests/requirements-a2a-spike.txt
          pytest -q tests/test_a2a_sdk_spike.py

      - name: Build and verify the preview wheel
        run: |
          pip install hatchling==1.29.0
          ARTIFACTS="$RUNNER_TEMP/preview-artifacts"
          python scripts/build_preview_wheel.py --commit "$(git rev-parse HEAD)" --output "$ARTIFACTS"
          (cd "$ARTIFACTS" && sha256sum --check SHA256SUMS)
          python -m venv "$RUNNER_TEMP/preview-wheel"
          "$RUNNER_TEMP/preview-wheel/bin/pip" install "$ARTIFACTS"/*.whl
          cd "$ARTIFACTS"
          "$RUNNER_TEMP/preview-wheel/bin/python" - <<'PYCODE'
          import json
          from importlib.metadata import version
          from pathlib import Path
          from agent_commons.client import CommonsClient
          from agent_commons.main import app
          from agent_commons.typed_worker import check_isolation
          assert version("agent-commons") == app.version == json.loads(
              Path("release-build.json").read_text()
          )["version"]
          assert callable(CommonsClient.delegate)
          check_isolation()
          PYCODE
          test "$("$RUNNER_TEMP/preview-wheel/bin/agent-commons" --version)" = \
            "$(python -c 'import json; print(json.load(open("release-build.json"))["version"])')"
          AGENT_COMMONS_REGISTRATION_ADMISSION=invalid "$RUNNER_TEMP/preview-wheel/bin/agent-commons" \
            --config "$RUNNER_TEMP/onboarding-agent" init --url https://atlas.example --name atlas
          test "$(stat -c '%a' "$RUNNER_TEMP/onboarding-agent/controller.key")" = 600

      - name: Upload verified wheel for review
        uses: actions/upload-artifact@v4
        with:
          name: preview-wheel
          path: ${{ runner.temp }}/preview-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Build Docker image
        run: docker build -t agent-commons:ci .
